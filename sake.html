    <header class="site-header is-scrolled" data-header>
      <a class="brand" href="index.html#top" aria-label="地酒と海鮮 四四一六 トップへ">

    <main>
      <section class="gallery-hero" aria-label="地酒ギャラリー">
        <div class="gallery-hero-copy reveal">

      <section class="seafood-gallery" aria-label="地酒の写真一覧">
        <button class="gallery-item reveal" type="button" data-lightbox-src="sake-gallery-01.jpg" data-lightbox-alt="三諸杉の地酒">
          <img src="sake-gallery-01.jpg" alt="三諸杉の地酒" loading="lazy">
        </button>
        <button class="gallery-item reveal" type="button" data-lightbox-src="sake-gallery-02.jpg" data-lightbox-alt="獺祭などの地酒">

        </button>
        <button class="gallery-item reveal" type="button" data-lightbox-src="sake-gallery-03.jpg" data-lightbox-alt="春らしい地酒">

        </button>
        <button class="gallery-item reveal" type="button" data-lightbox-src="sake-gallery-04.jpg" data-lightbox-alt="光栄菊などの地酒">

        <button class="gallery-item reveal" type="button" data-lightbox-src="sake-gallery-05.jpg" data-lightbox-alt="飛露喜と田酒">

        </button>
        <button class="gallery-item reveal" type="button" data-lightbox-src="sake-gallery-06.jpg" data-lightbox-alt="而今の地酒">
          <img src="sake-gallery-06.jpg" alt="而今の地酒" loading="lazy">
        </button>
      </section>

      <div class="gallery-back">
        <a class="text-link" href="index.html#kodawari">トップページへ戻る</a>
      </div>

    <div class="lightbox" data-lightbox aria-hidden="true">
      <button class="lightbox-close" type="button" data-lightbox-close aria-label="拡大写真を閉じる">×</button>
